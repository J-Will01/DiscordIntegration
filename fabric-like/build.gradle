architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    compileOnly(project(path: ':common', configuration: 'namedElements')) { transitive false }

    // Core library dependency - supports both local JAR and Maven
    def useLocalCore = project.hasProperty('use_local_core') ? project.use_local_core.toBoolean() : false
    if (useLocalCore) {
        def coreJar = file(project.hasProperty('local_core_path') ? project.local_core_path : '../DiscordIntegration-Core/build/libs/dcintegration-core-3.1.0.jar')
        if (!coreJar.exists()) {
            throw new FileNotFoundException("Local core JAR not found at: ${coreJar.absolutePath}. Please build DiscordIntegration-Core first or check local_core_path in gradle.properties")
        }
        println "Using local core JAR: ${coreJar.absolutePath}"
        modImplementation(files(coreJar))
    } else {
        println "Using Maven core dependency: de.erdbeerbaerlp:dcintegration.common:$rootProject.core_version"
        modImplementation("de.erdbeerbaerlp:dcintegration.common:$rootProject.core_version")
    }

    modImplementation("me.lucko:fabric-permissions-api:$rootProject.fabric_permissions_api")
    modImplementation "eu.pb4:placeholder-api:$rootProject.placeholder_api"

    //Styled Chat
    modCompileOnly "maven.modrinth:styled-chat:$rootProject.styled_chat"

    //Dynmap-API
    modCompileOnly('com.github.webbukkit:DynmapCoreAPI:2.5')

    //Vanish
    modCompileOnly "maven.modrinth:vanish:$rootProject.vanish"
}
repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven { url "https://maven.nucleoid.xyz/" }

    maven { url 'https://jitpack.io' }
}

processResources {
    inputs.property "minecraft_version", rootProject.minecraft_version

    filesMatching("fabric-like.dcintegration.mixins.json") {
        expand "minecraft_version": rootProject.minecraft_version
    }
}

loom {
    mixin {
        defaultRefmapName = "dcintegration-fabric-MC${project.property('minecraft_version')}-fabric-refmap.json"
    }
}